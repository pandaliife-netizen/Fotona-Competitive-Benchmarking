<script>
(function () {
  function norm(value) {
    return (value || '')
      .toLowerCase()
      .replace(/®|™/g, '')
      .replace(/\+/g, ' plus ')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function cleanDeviceName(name) {
    return (name || '')
      .replace(/LightWalker®\s*STE Pro Plus\s*II/gi, 'LightWalker® STE Pro Plus')
      .replace(/STE Pro Plus\s*II/gi, 'STE Pro Plus')
      .replace(/LightWalker®\s*II/gi, 'LightWalker®')
      .replace(/LightWalker\s*II/gi, 'LightWalker')
      .replace(/LightWalker®\s*2/gi, 'LightWalker®')
      .replace(/LightWalker\s*2/gi, 'LightWalker')
      .trim();
  }

  function isInternalFotonaView() {
    const bodyText = document.body ? document.body.innerText || '' : '';
    return /Compare Within Fotona/i.test(bodyText) ||
           /within the Fotona/i.test(bodyText) ||
           /Fotona lineup/i.test(bodyText);
  }

  function pill(label, type) {
    if (!label) return '';
    return '<span class="device-advantage-pill ' + type + '">' + cleanDeviceName(label) + '</span>';
  }

  function getSelectedDeviceName() {
    const cardLabels = Array.from(document.querySelectorAll('.summary-item, .summary-highlight'));
    for (const item of cardLabels) {
      const txt = item.innerText || '';
      if (/Fotona.*Device/i.test(txt)) {
        const lines = txt.split('\n').map(s => s.trim()).filter(Boolean);
        const value = lines[lines.length - 1];
        if (value) return cleanDeviceName(value);
      }
    }

    const title = document.querySelector('.content-card h2, h2, .header-title');
    return title ? cleanDeviceName(title.textContent.trim()) : 'Selected Device';
  }

  function selectedDeviceType(name) {
    const n = norm(name);
    if (n.includes('max')) return 'elite';
    if (n.includes('lightwalker') && !n.includes('ste pro') && !n.includes('max')) return 'advanced';
    if (n.includes('skypulse') || n.includes('ste pro')) return 'foundation';
    return 'selected';
  }

  function advantageForAttribute(rowLabel, selectedDevice) {
    const label = norm(rowLabel);
    const selected = norm(selectedDevice);

    // Tier is metadata, not an advantage.
    if (label.includes('tier')) return null;

    if (label.includes('modality') || label.includes('wavelength')) {
      if (selected.includes('lightwalker') && !selected.includes('ste pro')) return { label: 'Tie', type: 'tie' };
      return { label: 'LightWalker® / MAX', type: 'advanced' };
    }

    if (label.includes('key indication')) {
      return { label: 'LightWalker® MAX', type: 'elite' };
    }

    if (label.includes('proprietary')) {
      return { label: 'LightWalker® MAX', type: 'elite' };
    }

    if (label.includes('hard tissue')) {
      if (selected.includes('ste pro') || selected.includes('max')) return { label: 'Tie', type: 'tie' };
      return { label: 'LightWalker® MAX', type: 'elite' };
    }

    if (label.includes('anesthesia')) {
      return { label: 'Tie', type: 'tie' };
    }

    if (label.includes('clinical versatility')) {
      return { label: 'LightWalker® MAX', type: 'elite' };
    }

    if (label.includes('consumable')) {
      if (selected.includes('ste pro') || selected.includes('skypulse')) {
        return { label: cleanDeviceName(selectedDevice), type: selectedDeviceType(selectedDevice) };
      }
      return { label: 'Tie', type: 'tie' };
    }

    if (label.includes('pricing')) {
      if (selected.includes('ste pro') || selected.includes('skypulse')) {
        return { label: cleanDeviceName(selectedDevice), type: selectedDeviceType(selectedDevice) };
      }
      return { label: 'Fotona® LightWalker® STE Pro Plus', type: 'foundation' };
    }

    return null;
  }

  function updateLegendText() {
    if (!isInternalFotonaView()) return;

    const replacements = [
      ['Similar fit / comparable', 'Comparable capability'],
      ['Comparable to selected device', 'Comparable capability'],
      ['Comparable to Fotona', 'Comparable capability'],
      ['Different fit / limited overlap', 'Expanded or different capability'],
      ['Notable gap', 'Expanded or different capability'],
      ['Not aligned to this use case', 'Lower fit for this attribute'],
      ['Significantly behind Fotona', 'Lower fit for this attribute'],
      ['Significantly behind', 'Lower fit for this attribute']
    ];

    document.querySelectorAll('body *').forEach(function(el) {
      if (el.children.length === 0 && el.textContent) {
        replacements.forEach(function(pair) {
          if (el.textContent.includes(pair[0])) {
            el.textContent = el.textContent.replace(pair[0], pair[1]);
          }
        });
        el.textContent = cleanDeviceName(el.textContent);
      }
    });
  }

  function cleanAllDeviceNames() {
    document.querySelectorAll('th, td, h1, h2, h3, .s-value, .card-title, .summary-item').forEach(function(el) {
      if (el.children.length === 0 && el.textContent) {
        const updated = cleanDeviceName(el.textContent);
        if (updated !== el.textContent) el.textContent = updated;
      }
    });
  }

  function updateDeviceAdvantageColumn() {
    const __viewText = document.body ? (document.body.innerText || '') : '';
    if (/Compare Within Fotona/i.test(__viewText) || /within the Fotona/i.test(__viewText) || /Fotona lineup/i.test(__viewText)) return;
    if (!isInternalFotonaView()) return;

    const selectedDevice = getSelectedDeviceName();

    document.querySelectorAll('.table-wrap table:not(.market-benchmark-table)').forEach(function(table) {
      const rows = Array.from(table.rows || table.querySelectorAll('tr'));
      if (!rows.length) return;

      const headerCells = Array.from(rows[0].cells || rows[0].querySelectorAll('th,td'));
      if (headerCells.length) {
        headerCells[headerCells.length - 1].textContent = 'DEVICE ADVANTAGE';
      }

      rows.slice(1).forEach(function(row) {
        const cells = Array.from(row.cells || row.querySelectorAll('th,td'));
        if (cells.length < 2) return;

        const rowLabel = cells[0].textContent || '';
        const finalCell = cells[cells.length - 1];

        row.removeAttribute('data-attribute');
        row.classList.remove('tier-row');

        if (norm(rowLabel).includes('tier')) {
          row.setAttribute('data-attribute', 'tier');
          row.classList.add('tier-row');
          finalCell.innerHTML = '';
          finalCell.style.background = '#ffffff';
          return;
        }

        const adv = advantageForAttribute(rowLabel, selectedDevice);
        finalCell.innerHTML = adv ? pill(adv.label, adv.type) : '';
        finalCell.style.background = '#ffffff';
      });
    });
  }

  function run() {
    updateLegendText();
    cleanAllDeviceNames();
    updateDeviceAdvantageColumn();
  }

  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(run, 250);
    setTimeout(run, 900);
  });

  window.addEventListener('load', function () {
    setTimeout(run, 250);
  });

  document.addEventListener('click', function () {
    setTimeout(run, 250);
    setTimeout(run, 900);
  });
})();
</script>


<script id="final-dental-lineup-sync">
(function(){
  const DENTAL_IDS=['skypulse','lw-ste','lw-ii','lw-max'];

  function normalize(v){
    return String(v||'')
      .toLowerCase()
      .replace(/®|™/g,'')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }

  function isDentalFotonaLineup(){
    if(typeof state==='undefined') return false;
    if(state.division!=='dental' || state.view!=='vs-lineup') return false;
    return true;
  }

  function rowSpec(master,label){
    const n=normalize(label);
    if(n==='tier') return {type:'tier',value:master.tier};
    if(n.includes('pricing')) return {type:'tier',value:master.tier};
    if(n.includes('modality') || n.includes('wavelength'))
      return {type:'text',value:master.modality};
    if(n.includes('key indication'))
      return {type:'pills',attr:'Key Indications',value:master.indications};
    if(n.includes('key technologies') || n.includes('proprietary protocol'))
      return {type:'pills',attr:'Key Technologies / Modes',value:master.technologies};
    if(n.includes('hard tissue'))
      return {type:'detail',value:master.hardTissue||'—'};
    if(n.includes('clinical versatility') || n.includes('treatment categories') || n.includes('application categories'))
      return {type:'pills',attr:'Treatment Categories Covered',value:master.categories||'—'};
    return null;
  }

  function renderValue(spec,master){
    if(!spec) return '—';
    if(spec.type==='tier'){
      const tierKey=String(spec.value||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
      return `<span class="tier-badge tier-${tierKey}">${spec.value}</span>`;
    }
    if(spec.type==='pills'){
      return renderInfoPills(spec.value,spec.attr,null,true);
    }
    if(spec.type==='detail'){
      return `<div class="compact-detail">${spec.value}</div>`;
    }
    return `<div class="spec-plain">${spec.value}</div>`;
  }

  function sync(){
    if(!isDentalFotonaLineup()) return;
    if(typeof FOTONA_DEVICE_MASTER==='undefined' || typeof renderInfoPills!=='function') return;

    document.querySelectorAll('.table-wrap table').forEach(function(table){
      const rows=Array.from(table.rows||[]);
      if(rows.length<2) return;

      let headers=Array.from(rows[0].cells||[]);
      if(headers[0]) headers[0].textContent='DEVICE';

      // V35: enforce canonical benchmark column order in the rendered DOM.
      // Attribute column stays first; device columns follow DENTAL_IDS.
      const normalizeHeader=v=>normalize(v);
      const orderedCells=[headers[0]];
      DENTAL_IDS.forEach(function(id){
        const master=FOTONA_DEVICE_MASTER[id];
        if(!master) return;
        const target=normalizeHeader(master.name);
        const cell=headers.find(c=>
          normalizeHeader(c.textContent)===target ||
          normalizeHeader(c.textContent).includes(target.replace(/^fotona /,''))
        );
        if(cell) orderedCells.push(cell);
      });

      if(orderedCells.length===5){
        // Reorder header cells.
        orderedCells.forEach(c=>rows[0].appendChild(c));
        // Reorder matching body cells by original header identity.
        rows.slice(1).forEach(function(row){
          const originalHeaders=headers.slice();
          const originalCells=Array.from(row.cells||[]);
          const reordered=[originalCells[0]];
          DENTAL_IDS.forEach(function(id){
            const master=FOTONA_DEVICE_MASTER[id];
            const target=normalizeHeader(master.name);
            const headerIdx=originalHeaders.findIndex(c=>
              normalizeHeader(c.textContent)===target ||
              normalizeHeader(c.textContent).includes(target.replace(/^fotona /,''))
            );
            if(headerIdx>0 && originalCells[headerIdx]) reordered.push(originalCells[headerIdx]);
          });
          if(reordered.length===5) reordered.forEach(c=>row.appendChild(c));
        });
        headers=Array.from(rows[0].cells||[]);
      }

      const colMap={};

      DENTAL_IDS.forEach(function(id){
        const master=FOTONA_DEVICE_MASTER[id];
        if(!master) return;
        const target=normalize(master.name);
        const idx=headers.findIndex(function(c){
          return normalize(c.textContent)===target ||
                 normalize(c.textContent).includes(target.replace(/^fotona /,''));
        });
        if(idx>0) colMap[id]=idx;
      });

      // If the table does not contain all four dental devices, leave it alone.
      if(Object.keys(colMap).length<4) return;

      rows.slice(1).forEach(function(row){
        const cells=Array.from(row.cells||[]);
        if(!cells[0]) return;
        const label=cells[0].textContent||'';

        DENTAL_IDS.forEach(function(id){
          const idx=colMap[id];
          const cell=cells[idx];
          const master=FOTONA_DEVICE_MASTER[id];
          if(!cell || !master) return;

          const spec=rowSpec(master,label);
          if(!spec) return;

          cell.innerHTML=renderValue(spec,master);

          // The selected device keeps the red-accent Fotona treatment.
          cell.classList.toggle('fotona-td', state.device===id);
        });
      });

      headers.forEach(function(h,i){
        const matchingId=DENTAL_IDS.find(id=>colMap[id]===i);
        if(matchingId){
          h.classList.toggle('fotona-th', state.device===matchingId);
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded',function(){
    setTimeout(sync,200);
    setTimeout(sync,700);
  });

  window.addEventListener('load',function(){
    setTimeout(sync,250);
  });

  document.addEventListener('click',function(){
    setTimeout(sync,200);
    setTimeout(sync,700);
  });
})();
</script>

(function(){
  function enhanceBattlecard(){
    if(typeof state==='undefined' || state.pathType!=='competition' || state.step!==4) return;
    const rows=document.querySelectorAll('.spec-row, .battle-row, .detail-row');
    rows.forEach(row=>{
      const label=(row.querySelector('.spec-label,.label,.attr-label')?.textContent||'').trim();
      if(!/Key Indications|Treatment Categories/i.test(label)) return;
      const value=row.querySelector('.spec-value,.value,.detail-value');
      if(!value || value.querySelector('.info-pills')) return;
      const raw=value.textContent.trim().replace(/^•\\s*/gm,'').replace(/\\n+/g,', ');
      if(raw && typeof renderInfoPills==='function'){
        value.innerHTML=renderInfoPills(raw,label,null,true);
      }
    });
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(enhanceBattlecard,150));
  document.addEventListener('click',()=>{
    setTimeout(enhanceBattlecard,150);
    setTimeout(enhanceBattlecard,500);
  });
})();
</script>

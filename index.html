<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotona® Competitive Benchmark Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Georgia:ital@0;1&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}

:root {
  --red: #ed1c24;
  --red-dim: rgba(237,28,36,0.07);
  --red-border: rgba(237,28,36,0.25);
  --black: #000000;
  --grey: #414042;
  --grey-light: #80828a;
  --grey-border: #e5e5e5;
  --grey-bg: #f5f5f5;
  --white: #ffffff;
  --font-ui: 'Inter Tight', 'Inter', Arial, sans-serif;
  --font-serif: Georgia, 'Times New Roman', serif;
}

body {
  background:#ffffff;
  color:#000000;
  font-family:'Inter Tight',Arial,sans-serif;
  line-height: 1.45;
  min-height: 100vh;
  position: relative;
}

/* background gradient removed */

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  padding: 92px 5% 80px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
  align-items: start;
  box-sizing: border-box;
}

.main-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* INTRO SCREEN */
.intro-screen {
  min-height: calc(100vh - 64px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 32px 0;
  background:#ffffff;
}
.intro-card {
  max-width: 820px;
  width: 100%;
}
.intro-eyebrow {
 font-size: 11px;
 font-weight: 700;
 letter-spacing: 0.12em;
  font-family:'Inter Tight',Arial,sans-serif;
  color:#ed1c24;
  text-transform: uppercase;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.intro-headline {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: clamp(44px, 5vw, 72px);
  font-weight: 700;
  line-height: 0.92;
  letter-spacing: -0.025em;
  margin-bottom: 24px;
  color:#000000;
  text-transform: uppercase;
}
.intro-subtext {
  font-family: var(--font-serif);
  font-size: 15px;
  color:#414042;
  line-height: 1.75;
  margin-bottom: 28px;
  max-width: 520px;
}
.intro-support {
  font-family: var(--font-serif);
  font-size: 14px;
  color:#80828a;
  line-height: 1.6;
  margin-bottom: 36px;
  padding-left: 14px;
  border-left: 2px solid var(--grey-border);
}
.intro-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background:#ed1c24;
  color:#ffffff;
  border: none;
  border-radius: 0;
  padding: 14px 32px;
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
}
.intro-cta:hover { opacity: 0.88; }
.intro-cta-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-bottom: 48px;
}
.intro-cta-note {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 10px;
  color:#80828a;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.intro-step-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 2px solid var(--black);
  margin-bottom: 32px;
}
.intro-step-item {
  padding: 20px 18px;
  border-right: 1px solid var(--grey-border);
  border-bottom: 1px solid var(--grey-border);
}
.intro-step-item:last-child { border-right: none; }
.intro-step-num {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  color:#ed1c24;
  font-style: italic;
  line-height: 1;
  margin-bottom: 8px;
}
.intro-step-title {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color:#000000;
  margin-bottom: 6px;
}
.intro-step-desc {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 12px;
  color:#414042;
  line-height: 1.55;
}
.intro-cta:hover { background: #aa0000; transform: translateY(-1px); }

/* HEADER CARD */
.header-card { display: none !important; }
.badge-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tool-badge {
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  white-space: nowrap;
  border: none;
  padding: 0;
}
.step-label {
  color: rgba(255,255,255,0.4);
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 0.1em;
}
.path-badge {
 font-size: 10px;
 font-weight: 700;
 letter-spacing: 0.08em;
 padding: 4px 10px;
 border-radius: 0;
 text-transform: uppercase;
 white-space: nowrap;
}
.path-badge.fotona { background: #ed1c24; color: #ffffff; border: none; }
.path-badge.competition { background: rgba(255,255,255,0.15); color: #ffffff; border: 1px solid rgba(255,255,255,0.2); }

.header-title {
  font-family: Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  color: #000000;
  line-height: 1.15;
  margin-bottom: 6px;
  margin-top: 8px;
}
.header-subtitle {
  font-family: Georgia, serif;
  font-size: 15px;
  color: #414042;
  line-height: 1.6;
  margin-bottom: 20px;
}
.header-tip {
  color: #80828a;
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 11px;
  font-style: italic;
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin-bottom: 16px;
}
.header-tip::before { content: '💡'; font-style: normal; font-size: 11px; }

/* PROGRESS BAR */
.step-header {
  padding: 8px 0 4px;
  border-bottom: 1px solid #f0f0f0;
  margin-bottom: 16px;
}
.step-eyebrow {
  margin-bottom: 6px;
}
.step-eyebrow-text {
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.25em;
  color: #ed1c24;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-eyebrow-text::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 16px;
  background: #ed1c24;
  flex-shrink: 0;
}
.path-pill {
  background: #ed1c24;
  color: #ffffff;
  font-size: 9px;
  padding: 2px 8px;
  font-weight: 700;
  letter-spacing: 0.1em;
}
.progress-bar {
  display: flex;
  align-items: center;
  padding: 16px 0 20px;
}
.progress-step {
 display: flex;
 flex-direction: column;
 align-items: center;
 position: relative;
 flex: 1;
}
.progress-step:first-child { flex: 0 0 auto; align-items: flex-start; min-width: 32px; }
.progress-step:last-child { flex: 0 0 auto; align-items: flex-end; }
.progress-connector {
  flex: 1;
  height: 1px;
  background: #e5e5e5;
  margin-top: -15px;
  z-index: 0;
  transition: background 0.3s;
}
.progress-connector.active { background:#ed1c24; }
.step-circle {
  width: 28px;
  height: 28px;
  min-width: 28px;
  min-height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 10px;
  font-weight: 800;
  flex-shrink: 0;
  border: 1px solid #e5e5e5;
  background: #f5f5f5;
  color: #80828a;
  transition: all 0.2s;
}
.step-circle.active {
  background: #000000;
  border-color: #000000;
  color: #ffffff;
}
.step-circle.done {
  background: #ed1c24;
  border-color: #ed1c24;
  color: #ffffff;
}
.step-name {
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 10px;
  color: #80828a;
  margin-top: 6px;
  white-space: nowrap;
  font-weight: 500;
  letter-spacing: 0.05em;
}
.step-name.active { color: #000000; font-weight: 700; font-size: 10px; }
.step-name.done { color: #414042; }

/* CONTENT CARD */
.content-card {
  background: #ffffff;
  border: 1.5px solid #cccccc;
  border-top: 3px solid #ed1c24;
  border-radius: 0;
  padding: 28px 32px 32px;
}
.content-card h2 {
  font-family: Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  color: #000000;
  margin-bottom: 8px;
  line-height: 1.15;
}
.card-sub {
  font-family: Georgia, serif;
  font-size: 16px;
  color: #414042;
  margin-bottom: 20px;
  font-weight: 400;
  line-height: 1.5;
}
.card-tip {
 color:#414042;
 font-size: 12px;
 font-style: italic;
 margin-bottom: 20px;
 display: flex;
 gap: 5px;
 align-items: flex-start;
}
.card-tip::before { content: '💡'; font-style: normal; font-size: 11px; margin-top: 1px; }

/* SELECTION GRID */
.selection-grid { display: grid; gap: 12px; align-items: stretch; }
.selection-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.selection-grid.cols-3 { grid-template-columns: repeat(3, 1fr); gap: 14px; }
.selection-grid.cols-auto { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

.sel-card {
  background: #ffffff;
  border: 1.5px solid #cccccc;
  border-radius: 0;
  padding: 22px 24px;
  cursor: pointer;
  transition: border 0.15s, background 0.15s;
  position: relative;
  min-height: 100px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
.sel-card:hover { border-color:#80828a; background: #272727; transform: translateY(-1px); }
.sel-card.selected {
 border-color:#ed1c24;
 background: rgba(237,28,36,0.1);
}
.sel-card.selected::after {
 content: '✓';
 position: absolute;
 top: 10px; right: 12px;
 width: 20px; height: 20px;
 background:#ed1c24;
 color: #fff;
 border-radius: 50%;
 font-size: 11px;
 font-weight: 700;
 display: flex;
 align-items: center;
 justify-content: center;
 line-height: 20px;
 text-align: center;
}
.sel-card .card-badge {
  display: inline-block;
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 3px 10px;
  margin-bottom: 10px;
  border-radius: 0;
}





.sel-card .card-title {
  font-family: Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  color: #000000;
  margin-bottom: 6px;
  line-height: 1.2;
}
.sel-card .card-desc {
  font-family: Georgia, serif;
  font-size: 13px;
  color: #414042;
  line-height: 1.6;
}
.sel-card .card-meta { font-size: 12px; color: #80828a; margin-top: 5px; font-style: italic; }
.sel-card .card-use { font-size: 13px; color: #c6c6c6; margin-top: 6px; line-height: 1.4; border-top: 1px solid #2e2e2e; padding-top: 8px; }

.section-label {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color:#ed1c24;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

/* RESULT FRAMING HEADER */
.result-header {
 background: linear-gradient(135deg, rgba(204,0,0,0.12) 0%, rgba(204,0,0,0.04) 100%);
 border: 1px solid rgba(204,0,0,0.25);
 border-radius: 0;
 padding: 18px 22px;
 margin-bottom: 20px;
 display: flex;
 align-items: flex-start;
 gap: 14px;
}
.result-header-icon {
 font-size: 24px;
 flex-shrink: 0;
 margin-top: 2px;
}
.result-header-text h3 {
 font-size: 17px;
 font-weight: 700;
 color: #fff;
 margin-bottom: 4px;
}
.result-header-text p {
 font-size: 13px;
 color: #414042;
 line-height: 1.5;
}
.result-header-text .result-meta {
 font-size: 12px;
 color:#414042;
 margin-top: 6px;
 display: flex;
 gap: 16px;
 flex-wrap: wrap;
}
.result-meta span { display: flex; align-items: center; gap: 4px; }
.result-meta span::before { content: '·'; color: #414042; }
.result-meta span:first-child::before { display: none; }

/* TABLE */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border:1px solid #e5e5e5;
}
table {
 width: 100%;
 border-collapse: collapse;
 font-size: 13px;
 min-width: 500px;
}
thead tr { border-bottom: 1px solid var(--grey-border); }
th {
  padding: 10px 14px;
  text-align: left;
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background:#000000;
  color:#ffffff;
  border-bottom: 2px solid var(--red);
  vertical-align: bottom;
}
th.fotona-th {
  background:#ed1c24;
  color:#ffffff;
  border-bottom: 2px solid var(--red);
}
td {
  padding: 12px 14px;
  vertical-align: top;
  color:#000000;
  border-bottom: 1px solid var(--grey-border);
  line-height: 1.5;
  background:#ffffff;
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 12px;
}
tr:last-child td { border-bottom: none; }
td.attr-label {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color:#000000;
  background:#f5f5f5;
  white-space: nowrap;
  min-width: 130px;
  border-right: 2px solid var(--grey-border);
}
td.fotona-td {
  background:#000000;
  color:#ffffff;
  font-weight: 600;
  border-left: none;
  border-right: none;
}
tr:hover td { background: rgba(237,28,36,0.03); }
tr:hover td.fotona-td { background:#000000; }

/* BATTLECARD */
.battlecard {
 display: flex;
 flex-direction: column;
 gap: 1px;
 background: var(--grey-border);
 border-radius: 0;
 overflow: hidden;
 border:1px solid #e5e5e5;
}
.battlecard-row {
 display: grid;
 grid-template-columns: 200px 1fr;
 background: #ffffff;
 transition: background 0.1s;
}
.battlecard-row:hover { background:#f5f5f5; }
.battlecard-label {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color:#414042;
  padding: 14px 16px;
  border-right: 2px solid var(--grey-border);
  background:#f5f5f5;
  min-width: 160px;
  display: flex;
  align-items: center;
}
.battlecard-value {
  font-family: var(--font-serif);
  font-size: 13px;
  color:#000000;
  line-height: 1.65;
  padding: 14px 18px;
  flex: 1;
}
.battlecard-row.highlight .battlecard-label { color:#ed1c24; }
.battlecard-row.highlight .battlecard-value { color: #fff; font-weight: 500; font-size: 13px; }
.battlecard-row.strengths .battlecard-label { color: #7dba7d; }
.battlecard-row.strengths .battlecard-value { color: #fff; font-weight: 500; font-size: 13px; }
.battlecard-row.fotona-rec .battlecard-label { color: #7aabdf; }
.battlecard-row.fotona-rec .battlecard-value { color: #fff; font-weight: 600; font-size: 14px; }

/* SPEC CARD */
.spec-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 12px;
}
.spec-item {
 background:#f5f5f5;
 border-radius: 0;
 padding: 14px 16px;
 border: 1px solid #2e2e2e;
}
.spec-item.full-width { grid-column: 1 / -1; }
.spec-label {
  font-family:'Inter Tight',Arial,sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color:#80828a;
  margin-bottom: 6px;
}
.spec-value {
  font-family: var(--font-serif);
  font-size: 14px;
  color:#000000;
  line-height: 1.6;
}
.best-fit-box {
 background: rgba(204,0,0,0.07);
 border: 1px solid rgba(204,0,0,0.25);
 border-radius: 0;
 padding: 14px 16px;
 grid-column: 1 / -1;
}
.best-fit-box .spec-label { color:#ed1c24; }
.best-fit-box .spec-value { color: #fff; font-size: 14px; font-weight: 500; }

/* BULLETS */
.cell-bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.cell-bullets li { display: flex; align-items: flex-start; gap: 6px; line-height: 1.4; }
.cell-bullets li::before { content: '•'; color:#ed1c24; font-size: 14px; line-height: 1.35; flex-shrink: 0; }

/* VIEW ICON */
.view-icon { font-size: 22px; margin-bottom: 8px; }

/* SIDEBAR */
.sidebar-col { position: sticky; top: 24px; }
.summary-card {
  background: #000000;
  border: none;
  border-top: 3px solid #ed1c24;
  border-radius: 0;
  padding: 24px 24px;
  color: #ffffff;
  position: sticky;
  top: 80px;
}
.summary-card::before {
  content: 'ACTIVE BENCHMARK';
  display: inline-flex;
  align-items: center;
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #ffffff;
  background: #ed1c24;
  padding: 4px 10px;
  margin-bottom: 16px;
}

.summary-card::after {
 content: '';
 position: absolute;
 inset: 0;
 border-radius: 0;
 pointer-events: none;
 box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.04);
}
.summary-card.summary-updated {
 border-color: rgba(204,0,0,0.52);
 box-shadow:
   0 20px 46px rgba(0,0,0,0.56),
   0 0 22px rgba(204,0,0,0.14),
   inset 0 1px 0 rgba(255,255,255,0.95);
}
.summary-card h3 {
  font-family: Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 4px;
  line-height: 1.2;
}
.summary-card h3::after {
 content: '';
 display: block;
 width: 34px;
 height: 3px;
 background:#ed1c24;
 margin-top: 8px;
 border-radius: 0;
}
.summary-hint { font-family: Georgia, serif; color: rgba(255,255,255,0.35); font-size: 12px; margin-bottom: 16px; line-height: 1.5; font-style: italic; }
.summary-empty {
  font-family: Georgia, serif;
  color: rgba(255,255,255,0.28);
  font-size: 12px;
  line-height: 1.6;
  font-style: italic;
}
.summary-item {
  margin-bottom: 10px;
  padding: 14px 16px;
  background: #ffffff;
  border-left: 3px solid #ed1c24;
  border: 1px solid #cccccc;
  border-left: 3px solid #ed1c24;
}
.summary-item .s-label {
  font-family: 'Inter Tight', Arial, sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #ed1c24;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.summary-item .s-value {
  font-family: Georgia, serif;
  font-size: 15px;
  color: #000000;
  font-weight: 700;
  line-height: 1.3;
}
.summary-divider {
  height: 1px;
  background: linear-gradient(to right, #ed1c24, rgba(237,28,36,0.15), transparent);
  margin: 10px 0;
}
.summary-highlight {
  background: #ffffff;
  border: 1px solid rgba(237,28,36,0.25);
  border-left: 3px solid #ed1c24;
  padding: 14px 16px;
  margin-top: 12px;
}
.summary-highlight .s-label {
 color: #ff3333;
 font-size: 11px;
 font-weight: 900;
 letter-spacing: 0.08em;
 line-height: 1.35;
}
.summary-highlight .s-value { color: #000000; font-size: 14px; line-height: 1.55; font-weight: 750; margin-top: 6px; }
@keyframes summaryItemIn {
 from { opacity: 0; transform: translateY(4px); }
 to { opacity: 1; transform: translateY(0); }
}
@keyframes summaryHighlightIn {
 from { opacity: 0; transform: translateY(6px) scale(0.99); }
 to { opacity: 1; transform: translateY(0) scale(1); }
}



/* BENCHMARK TABLE POLISH */
.table-wrap {
 border: 1px solid rgba(255,255,255,0.08);
 box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
 background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
}

thead th {
 border-bottom: 1px solid rgba(255,255,255,0.10);
}

td, th {
 border-color: rgba(255,255,255,0.075);
}

/* Unify selected Fotona/device column into one continuous benchmark column */
th.fotona-th,
td.fotona-td {

function marketDeviceImageHtml(name,isFotona=false){
  let src='';
  if(isFotona){
    src=FOTONA_DEVICE_IMAGES[state.device]||'';
  } else {
    src=DENTAL_COMPETITOR_IMAGES[name]||'';
  }

  if(!src){
    return `<div class="market-device-image-stage market-image-missing"><span>IMAGE PENDING</span></div>`;
  }

  const safeName=String(name||'Device').replace(/"/g,'&quot;');
  return `<div class="market-device-image-stage${isFotona?' market-fotona-image':''}">
    <img src="${src}" alt="${safeName}" loading="lazy"
      onerror="this.style.display='none';this.parentElement.classList.add('market-image-missing');this.parentElement.innerHTML='<span>IMAGE PENDING</span>';">
  </div>`;
}

// Apply canonical data to the existing master first.
(function applyCanonicalFotonaDentalData(){
  const flatten=(groups)=>{
    const seen=new Set(), out=[];
    (groups||[]).forEach(g=>(g.items||[]).forEach(v=>{
      const value=String(v||'').trim();
      const key=value.toLowerCase();
      if(value && !seen.has(key)){seen.add(key);out.push(value);}
    }));
    return out.join('; ');
  };

  Object.entries(FOTONA_DENTAL_CANONICAL).forEach(([id,c])=>{
    const m=FOTONA_DEVICE_MASTER[id];
    if(!m) return;

    // Authoritative technical/comparison content.
    m.modality=c.modality;
    m.indicationGroups=c.indicationGroups;
    m.technologyGroups=c.technologyGroups;
    m.clinicalVersatilityGroups=c.clinicalVersatility;
    m.hardTissue=c.hardTissue;
    m.tier=c.tier;
    m.desc=c.description;
    m.bestFit=c.bestFit;

    // Legacy compatibility fields are GENERATED, never manually maintained.
    m.indications=flatten(c.indicationGroups);
    m.technologies=flatten(c.technologyGroups);
    m.categories=c.clinicalVersatility.join('; ');
  });
})();

function syncValidatedFotonaDentalMaster(){
  const dentalIds=['skypulse','lw-ste','lw-ii','lw-max'];

  const flattenGroups=(groups)=>{
    const seen=new Set(), out=[];
    (Array.isArray(groups)?groups:[]).forEach(group=>{
      (group&&Array.isArray(group.items)?group.items:[]).forEach(item=>{
        const value=String(item||'').trim();
        const key=value.toLowerCase();
        if(value && !seen.has(key)){ seen.add(key); out.push(value); }
      });
    });
    return out.join('; ');
  };

  dentalIds.forEach(id=>{
    const m=FOTONA_DEVICE_MASTER[id];
    const c=FOTONA_DENTAL_CANONICAL[id];
    if(!m || !c) return;

    // Regenerate all compatibility fields from the canonical structure.
    m.modality=c.modality;
    m.indicationGroups=c.indicationGroups;
    m.technologyGroups=c.technologyGroups;
    m.clinicalVersatilityGroups=c.clinicalVersatility;

    m.technologies=flattenGroups(c.technologyGroups);
    m.categories=c.clinicalVersatility.join('; ');

    // Device-selection cards.
    const d=DENTAL_DEVICES.find(x=>x.id===id);

  if(typeof LINEUP_DATA!=='undefined' && LINEUP_DATA.dental){

function applyFotonaMasterOverrides(){
  const allDeviceCards=[...DENTAL_DEVICES,...AESTH_DEVICES];
  allDeviceCards.forEach(card=>{
    const m=FOTONA_DEVICE_MASTER[card.id];
    if(m){
      card.name=m.name; card.tier=m.tier; card.desc=m.desc; card.modality=m.modality;
    } else if(card.id==='dyn-max') {
      card.name='Fotona® SP DYNAMIS MAX';
    }
  });

  function rowWithCompetitors(data, sourceKey, firstValue){
    const source=(data.rows[sourceKey]||[]).slice();
    if(!source.length) source.push(firstValue);
    source[0]=firstValue;
    return source;
  }

  Object.entries(FOTONA_DEVICE_MASTER).forEach(([id,m])=>{
    const data=COMP_DATA[id];
    if(!data) return;
    data.fotonaWins=m.wins||[];
    data.fotonaGaps=m.gaps||[];
    if(data.rows['Modality / Wavelength']) data.rows['Modality / Wavelength'][0]=m.modality;
    if(data.rows['Key Indications']) data.rows['Key Indications'][0]=m.indications;
    data.rows['Key Technologies / Modes']=rowWithCompetitors(data,'Proprietary Protocols',m.technologies||'—');
    if(data.rows['Hard Tissue Capability'] && m.hardTissue) data.rows['Hard Tissue Capability'][0]=m.hardTissue;
    if(data.rows['Clinical Versatility']) data.rows['Clinical Versatility'][0]=m.categories||m.desc;
    if(data.rows['Treatment Categories Covered']) data.rows['Treatment Categories Covered'][0]=m.categories||'—';
    if(data.rows['Skin Type Safety'] && m.skinSafety) data.rows['Skin Type Safety'][0]=m.skinSafety;

    if(id==='starformer'){
      data.rows['Therapy Modes']=rowWithCompetitors(data,'Proprietary Protocols',m.technologies);
      data.rows['Treatment Areas'][0]=m.applicationAreas||'—';
      data.attrs=['Technology Type','Key Indications','Therapy Modes','Treatment Areas','Pricing Tier','Target Buyer / Practice Type'];
      data.rows['Technology Type'][0]=m.modality;
      data.rows['Key Indications'][0]=m.indications;
    } else if(['skypulse','lw-ste','lw-ii','lw-max'].includes(id)){
      data.attrs=['Modality / Wavelength','Key Indications','Key Technologies / Modes','Hard Tissue Capability','Clinical Versatility'];
    } else {
      data.attrs=['Modality / Wavelength','Key Indications','Key Technologies / Modes','Treatment Categories Covered'];
      if(m.skinSafety) data.attrs.push('Skin Type Safety');
      data.attrs.push('Pricing Tier','Target Buyer / Practice Type');
    }

    STANDALONE_DATA[id]={
      ...(STANDALONE_DATA[id]||{}),
      name:m.name, tier:m.tier, modality:m.modality, indications:m.indications,

    delete STANDALONE_DATA[id].anesthesia;

    delete STANDALONE_DATA[id].consumables;
  });

    ['SkyPulse®','Fotona® SkyPulse® Multi II'],
    ['StarFormer®','Fotona® StarFormer® Pro'],
    ['LightWalker','Fotona® LightWalker® ATS']
  ];

    if(!bc.bestFotona) return;

  const attrs = ['Modality / Wavelength','Key Indications','Key Technologies / Modes','Hard Tissue Capability','Clinical Scope'];

  function competitorValue(rec, attr){
    if(!rec) return '—';
    if(attr==='Modality / Wavelength') return rec.modality||'—';
    if(attr==='Key Indications') return rec.indications||'—';
    if(attr==='Key Technologies / Modes') return rec.technologies||'—';
    if(attr==='Hard Tissue Capability') return rec.hardTissue||'—';
    if(attr==='Clinical Scope') return rec.scope||'—';
    return '—';
  }

  function fotonaValue(id, attr){
    const m=FOTONA_DEVICE_MASTER[id]||{};
    if(attr==='Modality / Wavelength') return m.modality||'—';
    if(attr==='Key Indications') return m.indications||'—';
    if(attr==='Key Technologies / Modes') return m.technologies||'—';
    if(attr==='Hard Tissue Capability') return m.hardTissue||'—';
    if(attr==='Clinical Scope') return m.categories||m.desc||'—';
    return '—';
  }

  Object.entries(defaults).forEach(([id,names])=>{
    const data=COMP_DATA[id];
    if(!data) return;
    data.attrs=attrs.slice();
    data.competitors=names.map(n=>(DENTAL_COMPETITOR_MASTER[n]||{}).name||n);
    data.rows={};
    attrs.forEach(attr=>{
      data.rows[attr]=[fotonaValue(id,attr),...names.map(n=>competitorValue(DENTAL_COMPETITOR_MASTER[n],attr))];
    });
  });

  // Update source-backed Fotona win/gap language only where the competitor
  // validation materially changed the previous comparison framing.
  if(COMP_DATA['skypulse']){
    COMP_DATA['skypulse'].fotonaGaps=(COMP_DATA['skypulse'].fotonaGaps||[])
      .filter(x=>!/DEKA|SmartPerio|anesthesia-free/i.test(x));
  }

  // Normalize brand battlecard technical fields used in the compact context cards.
  if(COMPETITOR_BATTLECARDS.denmat){
    COMPETITOR_BATTLECARDS.denmat.modality='Diode 808 ± 5 nm';
    COMPETITOR_BATTLECARDS.denmat.indications='Oral soft-tissue surgery and periodontal/sulcular procedures';
  }
  if(COMPETITOR_BATTLECARDS.periolase){
    COMPETITOR_BATTLECARDS.periolase.modality='Free-running Nd:YAG 1064 nm';
    COMPETITOR_BATTLECARDS.periolase.indications='Periodontal and peri-implant protocols, plus manufacturer-stated soft- and hard-tissue procedures';
  }
  if(COMPETITOR_BATTLECARDS.convergent){
    COMPETITOR_BATTLECARDS.convergent.modality='CO₂ 9.3 µm';
    COMPETITOR_BATTLECARDS.convergent.indications='Hard-tissue ablation, oral soft-tissue surgery, oral osseous procedures and enamel mineral-loss reduction';
  }
}

function splitCanonicalItems(value) {
  return String(value||'').split(';').map(v=>v.trim()).filter(Boolean);
}

function classifyCompetitorIndication(item) {
  const s=String(item||'').toLowerCase();
  if(/class i|cavit|caries|enamel|mineral-loss|enameloplasty/.test(s)) return 'Conservative Dentistry';
  if(/root[- ]?canal|pulpotomy|apico|endodont|pulp extirpation|leap/.test(s)) return 'Endodontic';
  if(/periodont|pocket|sulcular|curettage|subgingival|calculus/.test(s)) return 'Periodontal';
  if(/implant|peri-implant/.test(s)) return 'Implantology';
  if(/whiten/.test(s)) return 'Whitening';
  if(/pain|lllt|photobiomod|pbm|desensiti/.test(s)) return 'Therapy / PBM';
  if(/bone|osseous|osteotomy|osteoplasty|ostectomy/.test(s)) return 'Hard-Tissue / Osseous Surgery';
  if(/airway|sleep/.test(s)) return 'Airway / Sleep';
  if(/pediatric/.test(s)) return 'Pediatric Dentistry';
  if(/hygiene/.test(s)) return 'Hygiene';
  if(/soft[- ]?tissue|biopsy|frenect|gingiv|fibroma|operculect|hemostasis|oral lesion|crown lengthening|coagulation|vaporization|ablation|incision|excision/.test(s)) return 'Oral Soft-Tissue Surgery';
  return 'Other / General Dentistry';
}

function buildCompetitorIndicationGroups(value) {
  const groups={};
  splitCanonicalItems(value).forEach(item=>{
    const label=classifyCompetitorIndication(item);
    (groups[label]||(groups[label]=[])).push(item);
  });
  return Object.entries(groups).map(([label,items])=>({label,items}));
}

function deriveCompetitorVersatility(r) {
  const out=[];
  const add=v=>{ if(v && !out.includes(v)) out.push(v); };
  const ht=String(r['Hard Tissue Class']||'').toLowerCase();
  const indications=String(r['Key Indications']||'').toLowerCase();
  const category=String(r['Category']||'').toLowerCase();

  if(ht==='full') add('Conservative Dentistry');
  if(String(r['Soft Tissue']).toLowerCase()==='yes') add('Oral Soft-Tissue Surgery');
  if(String(r['Periodontal']).toLowerCase()==='yes') add('Periodontal');
  if(String(r['Endodontic']).toLowerCase()==='yes') add('Endodontic');
  if(String(r['Implant']).toLowerCase()==='yes') add('Implantology');
  if(String(r['Whitening']).toLowerCase()==='yes') add('Whitening');
  if(String(r['PBM / Pain Therapy']).toLowerCase()==='yes') add('Therapy / PBM');

  if(/bone|osseous|osteotomy|osteoplasty|ostectomy/.test(indications)) add('Hard-Tissue / Osseous Surgery');
  if(ht.includes('supported')) add('Hard-Tissue Procedures — Supported / Limited');
  if(/hygiene/.test(category+' '+indications)) add('Hygiene');
  if(/pediatric/.test(indications)) add('Pediatric Dentistry');
  if(/airway|sleep/.test(indications)) add('Airway / Sleep');
  if(/mineral-loss/.test(indications)) add('Preventive Dentistry');
  return out;
}

function buildCanonicalCompetitorRecord(r) {
  const modality=[r['Modality'],r['Wavelength(s)']].filter(Boolean).join(' · ');

  // Key Indications is a representative validated list, not an exhaustive
  // procedure count. Where the validated capability flags show an additional
  // clinical domain, include a neutral domain-level pill so the comparison
  // does not visually understate the platform.
  const indicationItems=splitCanonicalItems(r['Key Indications']);
  const indicationText=indicationItems.join('; ');
  const hasTerm=(rx)=>rx.test(indicationText.toLowerCase());
  const addRepresentative=(label,condition,rx)=>{
    if(condition && !hasTerm(rx)) indicationItems.push(label);
  };

  addRepresentative('Soft-tissue procedures',
    String(r['Soft Tissue']).toLowerCase()==='yes',
    /soft[- ]?tissue|gingiv|frenect|biopsy|curettage|coagulation|vaporization|ablation/);
  addRepresentative('Periodontal procedures',
    String(r['Periodontal']).toLowerCase()==='yes',
    /periodont|pocket|sulcular|curettage/);
  addRepresentative('Endodontic procedures',
    String(r['Endodontic']).toLowerCase()==='yes',
    /endodont|root[- ]?canal|pulpotomy|apico/);
  addRepresentative('Implant procedures',
    String(r['Implant']).toLowerCase()==='yes',
    /implant|peri-implant/);
  addRepresentative('Whitening',
    String(r['Whitening']).toLowerCase()==='yes',
    /whiten/);
  addRepresentative('Therapy / PBM',
    String(r['PBM / Pain Therapy']).toLowerCase()==='yes',
    /pain|therapy|pbm|photobiomod|lllt/);

  const normalizedIndications=indicationItems.join('; ');
  const indicationGroups=buildCompetitorIndicationGroups(normalizedIndications);
  const technologyGroups=[{
    label:'Technologies / Modes',
    items:splitCanonicalItems(r['Key Technologies / Modes'])
  }];
  const clinicalVersatility=deriveCompetitorVersatility(r);

  return {
    name:r['Device'],
    manufacturer:r['Manufacturer'],
    category:r['Category'],
    modality,
    wavelength:r['Wavelength(s)'],
    powerOutput:r['Power / Output'],
    pulseEnergy:r['Pulse Energy'],
    frequency:r['Frequency'],
    pulseDurationMode:r['Pulse Duration / Mode'],
    deliverySystem:r['Delivery System'],
    hardTissueClass:r['Hard Tissue Class'],
    hardTissue:r['Hard Tissue Class']==='Full'
      ? 'Full — laser hard-tissue capability'
      : (r['Hard Tissue Class']==='Supported / Limited' ? 'Supported / Limited' : 'None'),
    softTissue:r['Soft Tissue'],
    periodontal:r['Periodontal'],
    endodontic:r['Endodontic'],
    implant:r['Implant'],
    whitening:r['Whitening'],
    pbmPainTherapy:r['PBM / Pain Therapy'],
    indicationGroups,
    technologyGroups,
    clinicalVersatility,
    indications:normalizedIndications,
    technologies:splitCanonicalItems(r['Key Technologies / Modes']).join('; '),
    scope:clinicalVersatility.join('; '),
    consumables:r['Consumables / Accessories']
  };
}

const DENTAL_COMPETITOR_CANONICAL = Object.fromEntries(
  DENTAL_COMPETITOR_VALIDATED_ROWS.map(r=>[r.Device,buildCanonicalCompetitorRecord(r)])
);

function applyCanonicalDentalCompetitorData() {
  // Replace every existing rep-facing competitor record from the canonical source.
  Object.entries(DENTAL_COMPETITOR_CANONICAL).forEach(([name,c])=>{
    DENTAL_COMPETITOR_MASTER[name]={...(DENTAL_COMPETITOR_MASTER[name]||{}),...c};
  });

  const attrs=[
    'Modality / Wavelength',
    'Key Indications',
    'Key Technologies / Modes',
    'Hard Tissue Capability',
    'Clinical Versatility'
  ];

  const competitorValue=(rec,attr)=>{
    if(!rec) return '—';
    if(attr==='Modality / Wavelength') return rec.modality||'—';
    if(attr==='Key Indications') return rec.indications||'—';
    if(attr==='Key Technologies / Modes') return rec.technologies||'—';
    if(attr==='Hard Tissue Capability') return rec.hardTissue||'—';
    if(attr==='Clinical Versatility') return rec.scope||'—';
    return '—';
  };

  const fotonaValue=(id,attr)=>{
    const m=FOTONA_DEVICE_MASTER[id]||{};
    if(attr==='Modality / Wavelength') return m.modality||'—';
    if(attr==='Key Indications') return m.indications||'—';
    if(attr==='Key Technologies / Modes') return m.technologies||'—';
    if(attr==='Hard Tissue Capability') return m.hardTissue||'—';
    if(attr==='Clinical Versatility') return m.categories||'—';
    return '—';
  };

  // Preserve the validated competitor selections for each Fotona route, but
  // rebuild every displayed cell from canonical records.
  const defaults={
    'lw-ste':['Epic X','SOL','Picasso Pro','Gemini EVO 810 + 980'],
    'skypulse':['Waterlase iPlus','PerioLase MVP-7','Solea Model 2','Waterlase MDX450'],
    'lw-ii':['Waterlase iPlus','Solea Model 2','SiroLaser Blue','LS-2010'],
    'lw-max':['Waterlase iPlus','Waterlase MDX450','Solea Model 2','PerioLase MVP-7']
  };

  Object.entries(defaults).forEach(([id,names])=>{
    const data=COMP_DATA[id];
    if(!data) return;
    data.attrs=attrs.slice();
    data.competitors=names.map(n=>DENTAL_COMPETITOR_CANONICAL[n]?.name||n);
    data.rows={};
    attrs.forEach(attr=>{
      data.rows[attr]=[
        fotonaValue(id,attr),
        ...names.map(n=>competitorValue(DENTAL_COMPETITOR_CANONICAL[n],attr))
      ];
    });
  });
}

function sortedBullets(parts, key) {
 const order = BULLET_ORDER[key];
 if (!order || !parts || parts.length <= 1) return parts;
 return [...parts].sort((a,b) => {
 const ai = order.findIndex(o => a.toLowerCase().includes(o));
 const bi = order.findIndex(o => b.toLowerCase().includes(o));
 return (ai===-1?999:ai) - (bi===-1?999:bi);
 });

function splitOnComma(text) {
 const parts=[]; let current=''; let depth=0;
 for(let i=0;i<text.length;i++){
 const ch=text[i];
 if(ch==='(') depth++;
 else if(ch===')') depth--;
 if(depth===0&&ch===','&&text[i+1]===' '){parts.push(current.trim());current='';i++;}
 else current+=ch;
 }
 if(current.trim()) parts.push(current.trim());
 return parts;
}
function splitOnPlus(text) {
 const parts=[]; let current=''; let depth=0;
 for(let i=0;i<text.length;i++){
 const ch=text[i];
 if(ch==='(') depth++;
 else if(ch===')') depth--;
 if(depth===0&&ch==='+'&&text[i-1]===' '&&text[i+1]===' '){parts.push(current.trim());current='';i++;}
 else current+=ch;
 }
 if(current.trim()) parts.push(current.trim());
 return parts.length>0?parts:[text];
}
function splitValue(text, attr) {
 if(!text||text==='—') return [text||'—'];

 // Benchmark pill rows are stored as semicolon-delimited normalized values.
 // Split those first so every indication / technology renders as its own pill,
 // matching the Fotona presentation instead of creating one oversized bubble.
 if(attr==='Key Indications' ||
    attr==='Key Technologies / Modes' ||
    attr==='Proprietary Protocols' ||
    attr==='Treatment Categories Covered' ||
    attr==='Treatment Categories' ||
    attr==='Therapy Modes' ||
    attr==='Treatment Areas' ||
    attr==='Application Areas'){
   const semi=text.split(/;\s*/).map(x=>x.trim()).filter(Boolean);
   if(semi.length>1) return semi;
   return splitOnComma(text);
 }

 if(attr==='Modality / Wavelength'||attr==='Technology Type'){
 const sp=text.split(/;\s+/);
 if(sp.length>1){const p=[];sp.forEach(s=>p.push(...splitOnPlus(s)));return p.map(x=>x.trim()).filter(Boolean);}
 const pp=splitOnPlus(text);
 if(pp.length>1) return pp.map(x=>x.trim()).filter(Boolean);
 return splitOnComma(text);
 }
 if(attr==='Anesthesia Requirement'){const p=text.split(/;\s+/);if(p.length>1)return p.map(x=>x.trim()).filter(Boolean);}
 if(attr==='Clinical Versatility'){
 const pp=splitOnPlus(text);if(pp.length>1)return pp.map(x=>x.trim()).filter(Boolean);
 const sp=text.split(/;\s+/);if(sp.length>1)return sp.map(x=>x.trim()).filter(Boolean);
 }
 return splitOnComma(text);
}

let flowSidebarCollapsed=false;

let flowNavigationLock=false;
let flowLastScrollY=0;

function flowScrollTo(id){
  if(flowNavigationLock) return;
  flowNavigationLock=true;
  document.documentElement.style.overflowAnchor='none';

  const confirmationDelay=window.innerWidth<=900?130:210;
  const duration=window.innerWidth<=900?460:640;
  let attempts=0;

  const findAndMove=()=>{
    const el=document.getElementById(id);
    if(!el && attempts++<12){
      requestAnimationFrame(findAndMove);
      return;
    }
    if(!el){
      flowNavigationLock=false;
      document.documentElement.style.overflowAnchor='';
      return;
    }

    setTimeout(()=>{
      requestAnimationFrame(()=>{
        const offset=window.innerWidth<=1100?112:84;
        const refreshed=document.getElementById(id)||el;
        const startY=window.scrollY;
        const targetY=Math.max(0,startY+refreshed.getBoundingClientRect().top-offset);
        const distance=targetY-startY;
        const startTime=performance.now();
        const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

        const frame=(now)=>{
          const progress=Math.min(1,(now-startTime)/duration);
          window.scrollTo(0,startY+distance*ease(progress));
          if(progress<1){
            requestAnimationFrame(frame);
          }else{
            document.documentElement.style.overflowAnchor='';
            flowNavigationLock=false;
            flowLastScrollY=window.scrollY;
          }
        };
        requestAnimationFrame(frame);
      });
    },confirmationDelay);
  };

  requestAnimationFrame(findAndMove);
}

      value:state.competitorBrand?'Battlecard':null
    });
    rows.push({
      step:5,id:'flow-results',label:'Device Lineup',
      value:(state.step>=5&&state.competitorBrand)?'Competitor devices':null
    });
  }else{
    rows.push({step:3,id:'flow-next',label:'Selection',value:null});
    rows.push({step:4,id:'flow-analysis',label:'Analysis',value:null});
    rows.push({step:5,id:'flow-results',label:'Benchmark',value:null});
  }

  return rows;
}

function currentFlowStatusLabel(){
  const row=flowStatusRows().find(r=>r.id===flowActiveId);
  if(!row) return 'Build your benchmark';
  return row.value||row.label;
}

function navigateFromStatus(step,id){
  const row=flowStatusRows().find(r=>r.id===id);
  if(!row) return;

  const accessible=!!row.value || id===flowActiveId ||
    id==='flow-division' ||
    (id==='flow-path' && !!state.division) ||
    (id==='flow-device' && state.pathType==='fotona') ||
    (id==='flow-brand' && state.pathType==='competition');

  if(!accessible) return;

  flowActiveId=id;
  flowSidebarCollapsed=(id==='flow-results');
  flowMobileStatusOpen=false;
  render();
  flowScrollTo(id);
}

function renderStatusRows(forMobile=false){
  const rows=flowStatusRows();
  return rows.map((row,index)=>{
    const active=row.id===flowActiveId;
    const complete=!!row.value && !active;
    const accessible=active || !!row.value ||
      row.id==='flow-division' ||
      (row.id==='flow-path' && !!state.division) ||
      (row.id==='flow-device' && state.pathType==='fotona') ||
      (row.id==='flow-brand' && state.pathType==='competition');

    const cls=[
      'flow-status-row',
      active?'is-active':'',
      complete?'is-complete':''
    ].filter(Boolean).join(' ');

    const marker=complete?'✓':String(index+1);
    const val=row.value || (active?'Make a selection':'Upcoming');
    const title=(row.value?`${row.label}: ${row.value}`:row.label).replace(/"/g,'&quot;');

    return `<button class="${cls}" ${accessible?'':"disabled"}
      onclick="${accessible?`navigateFromStatus(${row.step},'${row.id}')`:''}"
      title="${title}">
      <span class="flow-status-circle">${marker}</span>
      <span class="flow-status-copy">
        <span class="flow-status-label">${row.label}</span>
        <span class="flow-status-value">${val}</span>
      </span>
    </button>`;
  }).join('');
}

function toggleMobileFlowStatus(){

function installFlowScrollBackBehavior(){
  if(window.__benchmarkRefinedScrollBound) return;
  window.__benchmarkRefinedScrollBound=true;

  flowLastScrollY=window.scrollY;
  let rafPending=false;
  let revealCooldown=false;
  let accumulatedUp=0;

  const inspectScroll=()=>{
    rafPending=false;
    if(flowNavigationLock || revealCooldown) return;

    const y=window.scrollY;
    const delta=flowLastScrollY-y;
    flowLastScrollY=y;

    // Match the reference behavior: forward movement is selection-driven.
    // Automatic section reopening only happens when the user intentionally
    // scrolls BACK upward.
    if(delta<=0){
      accumulatedUp=0;
      return;
    }

    accumulatedUp+=delta;

    // Ignore tiny trackpad/mouse movements. The user needs a meaningful
    // upward gesture before an earlier section can reopen.
    const requiredTravel=window.innerWidth<=700?72:96;
    if(accumulatedUp<requiredTravel) return;

    const activationLine=window.innerWidth<=700?140:
                         window.innerWidth<=1100?128:96;

    const summaries=[...document.querySelectorAll('.benchmark-flow-summary[data-section-id]')];
    const eligible=summaries
      .map(el=>{
        const r=el.getBoundingClientRect();
        return {el,top:r.top,distance:Math.abs(r.top-activationLine)};
      })
      .filter(x=>x.top>=activationLine-28 && x.top<=activationLine+92);

    if(!eligible.length) return;
    eligible.sort((a,b)=>a.distance-b.distance);

    const candidate=eligible[0].el;
    const id=candidate.getAttribute('data-section-id');
    if(!id || id===flowActiveId) return;

    const oldTop=candidate.getBoundingClientRect().top;
    flowActiveId=id;
    flowSidebarCollapsed=false;
    revealCooldown=true;
    accumulatedUp=0;

    render();

    requestAnimationFrame(()=>{
      const refreshed=document.getElementById(id);
      if(refreshed){
        const newTop=refreshed.getBoundingClientRect().top;
        window.scrollBy(0,newTop-oldTop);
      }
      flowLastScrollY=window.scrollY;
      setTimeout(()=>{ revealCooldown=false; },420);
    });
  };

  window.addEventListener('scroll',()=>{
    if(rafPending) return;
    rafPending=true;
    requestAnimationFrame(inspectScroll);
  },{passive:true});
}

      sections+=flowActiveSection(

        'Competitive landscape',
        'Which competitor do you want to review?',

                <h1 class="header-title" id="headerTitle"></h1>
                <p class="header-subtitle" id="headerSubtitle"></p>
                <div id="headerTip"></div>
                <div id="contentBody"></div>
              </div>
            </div>
          </section>`;
      }else{
        sections+=flowSummarySection(
          'flow-battlecard','Competitive Context',
          `${state.competitorBrandName} battlecard`,4
        );
      }
    }

    // 5. COMPETITOR DEVICE LINEUP
    if(state.step>=5 && state.competitorBrand){
      if(flowActiveId==='flow-results'){
        sections+=`
          <section id="flow-results" class="benchmark-flow-active flow-results-active" data-flow-step="5">
            <div class="benchmark-flow-inner flow-result-shell">

                <h1 class="header-title" id="headerTitle"></h1>
                <p class="header-subtitle" id="headerSubtitle"></p>
                <div id="headerTip"></div>
                <div id="contentBody"></div>
              </div>
            </div>
          </section>`;
      }else{
        sections+=flowSummarySection(
          'flow-results','Device Lineup',
          `${state.competitorBrandName} devices`,5
        );
      }
    }
  }

  app.innerHTML=`
    ${renderMobileBenchmarkContext()}
    <div class="benchmark-journey-layout ${flowSidebarCollapsed?'sidebar-collapsed':''}">
      <main class="benchmark-journey-main">${sections}</main>
      ${renderFlowSidebar()}
    </div>`;

  updateSummary();
  setTimeout(shrinkRegistered,10);

  // Only render detailed result components when their section is actually open.
  if(state.pathType==='fotona' && state.device && state.view && flowActiveId==='flow-results'){
    renderFotonaResults();
  }else if(state.pathType==='competition' && state.competitorBrand && flowActiveId==='flow-battlecard'){
    renderCompetitorBattlecard();
    const body=document.getElementById('contentBody');
    if(body && state.step<5){
      body.insertAdjacentHTML('beforeend',
        `<button class="flow-continue" onclick="continueCompetitorFlow()">Continue to device lineup ↓</button>`);
    }
  }else if(state.pathType==='competition' && state.step>=5 &&
           state.competitorBrand && flowActiveId==='flow-results'){
    renderCompetitorDevices();
  }

  installFlowScrollBackBehavior();
}

function updateProgress() {
 const labels = getStepLabels();
 const el = document.getElementById('stepLabel');
 if(el && state.step>=1) el.textContent = `Step ${state.step} of 5`;
 const pb = document.getElementById('progressBar');
 if(!pb) return;
 let html = '';
 for(let i=0;i<labels.length;i++){
 const snum = i+1;
 const isDone = snum < state.step;
 const isActive = snum === state.step;
 const cls = isDone?'done':isActive?'active':'';
 const nameCls = isDone?'done':isActive?'active':'';
 html += `<div class="progress-step">
 <div class="step-circle ${cls}">${isDone?'✓':snum}</div>

function getCapIndicator(val, attr) {
  if(!val||val==='—'||val==='-') return 'cap-none';
  const v = val.toLowerCase();
  const a = (attr||'').toLowerCase();

  // ── MODALITY / WAVELENGTH ──
  if(a.includes('modality') || a.includes('wavelength') || a.includes('technology type')) {
    // Full: Er:YAG + Nd:YAG together — Fotona dual-wavelength standard
    if(v.includes('er:yag')&&(v.includes('nd:yag')||v.includes('full pulse'))) return 'cap-full';
    // Full: Er:YAG + BBL modular (Sciton) — has both clinically relevant wavelengths
    if(v.includes('er:yag')&&v.includes('bbl')) return 'cap-full';
    // Partial: Er:YAG only or Er,Cr:YSGG — meaningful but missing Nd:YAG
    if(v.includes('er:yag')||v.includes('er,cr:ysgg')) return 'cap-partial';
    // Partial: Nd:YAG with meaningful multi-wavelength (picosecond multi, Alexandrite+Nd:YAG)
    if(v.includes('nd:yag')&&(v.includes('ktp')||v.includes('14 modalities')||v.includes('300ps'))) return 'cap-partial';
    if(v.includes('755nm')&&v.includes('nd:yag')) return 'cap-partial';
    // Partial: single Nd:YAG or meaningful picosecond multi-wavelength
    if(v.includes('nd:yag')) return 'cap-partial';
    if(v.includes('picosecond')&&(v.includes('532nm')||v.includes('785nm'))) return 'cap-partial';
    // None: diode, CO2, IPL, RF, HIFEM, no laser
    return 'cap-none';
  }

  // ── HARD TISSUE CAPABILITY ──
  if(a.includes('hard tissue')) {
    // Full: Er:YAG + Nd:YAG — highest tier
    if(v.includes('er:yag')&&v.includes('nd:yag')) return 'cap-full';
    // Full: full Er:YAG — true hard tissue
    if(v.includes('full er:yag')||v.includes('true hard tissue')) return 'cap-full';
    // Partial: Er:YAG hard tissue capable (single wavelength, less than full suite)
    if(v.includes('er:yag hard tissue')) return 'cap-partial';
    // Partial: Er,Cr:YSGG — similar but not Er:YAG
    if(v.includes('full er,cr')||v.includes('er,cr:ysgg')) return 'cap-partial';
    // Partial: all-tissue CO2 — hard tissue capable but different mechanism
    if(v.includes('all-tissue co')) return 'cap-partial';
    // None: CO2 soft tissue only, none, rotary
    if(v.includes('co₂ soft tissue')||v.includes('co2 soft tissue')) return 'cap-none';
    if(v.includes('none')||v.includes('rotary')||v.includes('electric')||v.includes('n/a')) return 'cap-none';
    return 'cap-none';
  }

  // ── ANESTHESIA REQUIREMENT ──
  if(a.includes('anesthesia')) {
    // Full: truly anesthesia-free — no qualifier
    if(v==='anesthesia-free'||v.startsWith('anesthesia-free')) return 'cap-full';
    // Partial: often anesthesia-free — qualifier "often" means not always
    if(v.includes('often anesthesia-free')) return 'cap-partial';
    // Partial: reduced anesthesia
    if(v.includes('reduced')) return 'cap-partial';
    // None: required for most, N/A mechanical
    if(v.includes('required for most')||v.includes('n/a')||v.includes('mechanical')) return 'cap-none';
    return 'cap-partial';
  }

  // ── CLINICAL VERSATILITY ──
  if(a.includes('clinical versatility')||a.includes('versatility')) {
    // Full: dual-wavelength with full aesthetic crossover — only Fotona
    if(v.includes('full')&&v.includes('aesthetic crossover')&&v.includes('dual-wavelength')) return 'cap-full';
    if(v.includes('full multi-specialty')&&v.includes('aesthetic crossover')) return 'cap-full';
    // Partial: full all-tissue dental but NO aesthetic crossover — meaningful but limited
    if(v.includes('full')&&v.includes('no facial aesthetic crossover')) return 'cap-partial';
    if(v.includes('full dual')||v.includes('multi-specialty')) return 'cap-partial';
    // Partial: hard tissue + multi-discipline but no aesthetic crossover (STE tier)
    if(v.includes('soft and hard tissue')&&v.includes('multi-discipline')) return 'cap-partial';
    if(v.includes('soft tissue and pbm')) return 'cap-partial';
    // None: no laser, rotary, implantology only, soft tissue only, perio only
    if(v.includes('no laser')||v.includes('rotary only')||v.includes('implantology and restorative only')) return 'cap-none';
    if(v.includes('no facial')&&v.includes('soft tissue only')) return 'cap-none';
    if(v.includes('soft tissue only')) return 'cap-none';
    if(v.includes('perio only')||v.includes('endo adjunct only')) return 'cap-none';
    if(v.includes('endo-focused')) return 'cap-none';
    return 'cap-partial';
  }

  // ── CONSUMABLE COST ──
  if(a.includes('consumable')) {
    // Full: truly zero consumables
    if(v.includes('no consumable')) return 'cap-full';
    // Partial: low but still has consumables (fiber tips, tips, etc)
    if(v.includes('low, fiber')||v.includes('low, tips')||v.includes('low, minimal')) return 'cap-partial';
    if(v==='low') return 'cap-full'; // bare "low" without qualifier = closest to no consumables
    if(v.startsWith('low')) return 'cap-partial';
    // Partial: medium consumables
    if(v.startsWith('medium')||v.includes('medium,')) return 'cap-partial';
    // None: high consumables, cycle cards
    if(v.startsWith('high')||v.includes('cycle card')) return 'cap-none';
    return 'cap-partial';
  }

  // ── PRICING TIER ──
  if(a.includes('pricing')) {
    if(v.includes('elite')||v.includes('premium')) return 'cap-full';
    if(v.includes('mid')) return 'cap-partial';
    if(v.includes('entry')||v.includes('foundation')) return 'cap-none';
    return 'cap-partial';
  }

  // ── TREATMENT CATEGORIES / KEY INDICATIONS ──
  if(a.includes('treatment categor')||a.includes('key indication')) {
    if((v.includes('skin')&&v.includes('hair')&&v.includes('vascular'))||(v.includes('full dental')&&v.includes('facial'))||(v.includes('fotona4d'))) return 'cap-full';
    if(v.includes('all-tissue')&&v.includes('perio')&&v.includes('endo')) return 'cap-partial';
    if(v.includes('skin')&&(v.includes('hair')||v.includes('vascular'))) return 'cap-partial';
    if(v.includes('pelvic floor only')||v.includes('gyn non-invasive only')||v.includes('soft tissue only')||v.includes('perio only')||v.includes('endo irrigation')) return 'cap-none';
    if(v.includes('soft tissue')&&!v.includes('hard')) return 'cap-none';
    return 'cap-partial';
  }

  // ── DOWNTIME / PATIENT COMFORT ──
  if(a.includes('downtime')||a.includes('comfort')) {
    // Full: truly minimal to none with no qualifier
    if(v.includes('minimal to none')&&!v.includes('often')) return 'cap-full';
    if(v.includes('low to none')&&!v.includes('often')) return 'cap-full';
    // Full: zero downtime explicitly
    if(v==='none'||v==='no downtime') return 'cap-full';
    if(v.includes('none, seated')||v.includes('no downtime')) return 'cap-full';
    // Partial: low, minimal with qualifiers, photoacoustic
    if(v.includes('often')||v.includes('depending on')) return 'cap-partial';
    if(v.includes('minimal to none')&&v.includes('often')) return 'cap-partial';
    if(v.startsWith('low')||v.startsWith('minimal')) return 'cap-partial';
    // None: moderate or high
    if(v.includes('moderate')||v.includes('high')) return 'cap-none';
    return 'cap-partial';
  }

  // ── SKIN TYPE SAFETY ──
  if(a.includes('skin type')||a.includes('fitzpatrick')) {
    // Full: all Fitzpatrick I-VI with no dependency qualifier
    if((v.includes('i–vi')||v.includes('all fitzpatrick')||v.includes('all skin'))&&!v.includes('depending')) return 'cap-full';
    // Partial: I-VI but with dependency (handpiece, module) or I-V range
    if(v.includes('i–vi')&&v.includes('depending')) return 'cap-partial';
    if(v.includes('i–v')&&!v.includes('i–vi')) return 'cap-partial';
    if(v.includes('i–iv')) return 'cap-partial';
    if(v.includes('all tissue types')) return 'cap-partial';
    if(v.includes('i–iii')) return 'cap-none';
    return 'cap-partial';
  }

  // ── PROPRIETARY PROTOCOLS ──
  // Green: has multiple named proprietary protocols
  // Amber: has one named protocol
  // Red: none / no laser protocols
  if(a.includes('proprietary protocol')||a.includes('key technologies')||a.includes('therapy modes')) {
    if(v==='none'||v.includes('none —')||v.includes('none –')||v.startsWith('none')) return 'cap-none';
    if(v.includes('no laser')||v.includes('no named')||v.includes('no protocol')) return 'cap-none';
    // Count named protocols — ® and ™ are good signals
    // Preset programs are not proprietary protocols
    if(v.includes('preset program')||v.includes('preset protocol')) return 'cap-none';
    const protocolCount=(v.match(/[®™]/g)||[]).length;
    if(protocolCount>=3) return 'cap-full';
    if(protocolCount>=1) return 'cap-partial';
    return 'cap-none';
  }

  // ── TARGET BUYER / PRACTICE TYPE ──
  if(a.includes('target buyer')||a.includes('practice type')) {
    if(v.includes('dermatology')&&v.includes('plastics')) return 'cap-full';
    if(v.includes('dermatology')||v.includes('med-spa')) return 'cap-partial';
    return 'cap-partial';
  }

  // ── SESSION EXPERIENCE / TECHNOLOGY TYPE ──
  if(a.includes('session')||a.includes('technology type')) {
    if(v.includes('no downtime')&&v.includes('non-invasive')) return 'cap-full';
    if(v.includes('non-invasive')) return 'cap-partial';
    return 'cap-partial';
  }

  // ── TREATMENT AREAS ──
  if(a.includes('treatment area')) {
    if(v.includes('abdomen')&&v.includes('pelvic')) return 'cap-full';
    if(v.includes('abdomen')||v.includes('pelvic floor')) return 'cap-partial';
    return 'cap-partial';
  }

  return 'cap-partial';
}
function hardTissueScore(value){
  const v=String(value||'').toLowerCase();
  if(!v || v==='—' || v==='-') return null;

  if(v.includes('none') ||
     v.includes('no hard tissue') ||
     v.includes('soft tissue only') ||
     v.includes('diode only') ||
     v.includes('rotary only')) return 0;

  if(v.includes('hard-tissue') ||
     v.includes('hard tissue') ||
     v.includes('osseous') ||
     v.includes('er:yag') ||
     v.includes('er,cr:ysgg')) return 2;

  if(v.includes('partial') || v.includes('limited')) return 1;
  return null;
}

function getEdgeVerdict(fotonaVal, compVals, compNames, attr) {
  const a=String(attr||'').toLowerCase();

  // Device-level automated comparison is defensible here because the
  // field represents a discrete capability rather than a subjective claim.
  if(a.includes('hard tissue')){
    const f=hardTissueScore(fotonaVal);
    const cs=compVals.map(hardTissueScore);
    const valid=cs.filter(v=>v!==null);
    if(f===null || !valid.length) return {label:'—',cls:'edge-none'};

    const maxComp=Math.max(...valid);
    if(f>maxComp) return {label:'Fotona® edge',cls:'edge-fotona'};
    if(f===maxComp) return {label:'Comparable',cls:'edge-tie'};

    const winnerIdx=cs.findIndex(v=>v===maxComp);
    const winnerName=(compNames&&compNames[winnerIdx])
      ? compNames[winnerIdx].split(' ').slice(0,2).join(' ')
      : 'Competitor';
    return {label:winnerName+' edge',cls:'edge-comp'};
  }

  // Pricing, target buyer, skin type, modality, technology count,
  // indication breadth and workflow claims are context-dependent.
  return {label:'—',cls:'edge-none'};
}

function capColor(cap) {
  if(cap==='cap-full') return '#4caf50';
  if(cap==='cap-partial') return '#f0a500';
  return '#e05252';
}

function renderCapCell(raw, attr, sk) {
  if(!raw||raw==='—') return `<span style="color:#555;">—</span>`;
  const cap = getCapIndicator(raw, attr);
  const color = capColor(cap);
  if(shouldUsePills(attr)) return renderInfoPills(raw,attr,sk,false,color);
  const parts = splitValue(raw, attr);
  const sorted = sortedBullets(parts, sk);
  return `<ul class="cell-bullets">${sorted.map(p=>`<li style="color:${color};">${toSentenceCase(p)}</li>`).join('')}</ul>`;
}

function marketFotonaValue(deviceId, attr, data){
  const m=(typeof FOTONA_DEVICE_MASTER!=='undefined')?FOTONA_DEVICE_MASTER[deviceId]:null;
  const rows=data&&data.rows?data.rows:{};
  if(!m) return (rows[attr]&&rows[attr][0])||'—';

  const a=String(attr||'').toLowerCase();
  if(a.includes('modality') || a.includes('wavelength') || a.includes('technology type')) return m.modality||'—';
  if(a.includes('key indication')) {
    // Prefer the validated procedure-level application groups when available so
    // Fotona is shown at the same level of clinical detail as competitors.
    if(Array.isArray(m.indicationGroups) && m.indicationGroups.length){
      const detailed=[];
      m.indicationGroups.forEach(g=>{
        (g.items||[]).forEach(item=>{ if(item && !detailed.includes(item)) detailed.push(item); });
      });
      if(detailed.length) return detailed.join('; ');
    }
    return m.indications||'—';
  }
  if(a.includes('key technologies') || a.includes('proprietary protocol') || a.includes('therapy modes')) {
    // Likewise use the detailed technology groups instead of only the abbreviated
    // category list when the validated master contains them.
    if(Array.isArray(m.technologyGroups) && m.technologyGroups.length){
      const detailed=[];
      m.technologyGroups.forEach(g=>{
        (g.items||[]).forEach(item=>{ if(item && !detailed.includes(item)) detailed.push(item); });
      });
      if(detailed.length) return detailed.join('; ');
    }
    return m.technologies||'—';
  }
  if(a.includes('hard tissue')) return m.hardTissue||'—';
  if(a.includes('clinical versatility') || a.includes('treatment categories') || a.includes('application categories')) return m.categories||m.desc||'—';
  if(a.includes('skin type')) return m.skinSafety||'—';
  if(a.includes('treatment areas') || a.includes('application areas')) return m.applicationAreas||'—';
  if(a.includes('pricing') || a==='tier') return m.tier||'—';
  if(a.includes('target buyer')) return m.bestFit||((rows[attr]&&rows[attr][0])||'—');
  return (rows[attr]&&rows[attr][0])||'—';
}

function marketUsesPills(attr){
  const a=String(attr||'').toLowerCase();
  return shouldUsePills(attr) ||
         a.includes('clinical versatility');
}

function renderMarketCell(raw, attr, sk, isFotona=false){
  if(!raw || raw==='—') return `<span class="market-dash">—</span>`;

  const a=String(attr||'').toLowerCase();

  if(marketUsesPills(attr)){
    return renderInfoPills(raw,attr,sk,isFotona);
  }

  if(a.includes('pricing') || a==='tier'){
    const tier=String(raw).trim();
    const known=/foundation|advanced|elite|entry-mid/i.test(tier);
    return known
      ? `<span class="card-badge badge-${tierClassName(tier)}">${tier}</span>`
      : `<div class="market-compact-text">${tier}</div>`;
  }

  if(a.includes('modality') || a.includes('wavelength') || a.includes('technology type')){
    return `<div class="market-tech-text">${raw}</div>`;
  }

  if(a.includes('hard tissue') || a.includes('skin type') || a.includes('target buyer')){
    return `<div class="market-compact-text">${raw}</div>`;
  }

  return `<div class="market-compact-text">${raw}</div>`;
}

'dentsply':'dentsply','sirolaser':'dentsply',
    'lightscalpel':'lightscalpel',
    'cartessa':'cartessa','cynosure':'cynosure','clarity':'cynosure',
    'btl':'btl','emsculpt':'btl','emsella':'btl','sofwave':'sofwave',
    'candela':'candela','gentle pro':'candela','picoway':'candela',
    'lumenis':'lumenis','stellar':'lumenis','splendor':'lumenis',
    'jeisys':'jeisys','potenza':'jeisys','aerolase':'aerolase','neo elite':'aerolase',
    'amp':'amp','cutera':'cutera','aviclear':'cutera','excel v':'cutera',
    'sciton':'sciton','halo':'sciton','inmode':'inmode','morpheus':'inmode',
    'alma':'alma','soprano':'alma','solta':'solta','thermage':'solta','fraxel':'solta',

  function findBattlecard(compNames){
    for(const name of compNames){
      const nl=name.toLowerCase();

        if(nl.includes(keyword)) return COMPETITOR_BATTLECARDS[key]||null;

  const strengths=bc?(bc.strengths||'').split(',').filter(Boolean).map(x=>`<li>${x.trim()}</li>`).join(''):'';
  const weaknesses=bc?(bc.weakness||'').split(',').filter(Boolean).map(x=>`<li>${x.trim()}</li>`).join(''):'';

  const matrix=`

// V27 — Current validated Fotona dental data is authoritative.
// Internal lineup rows must render from FOTONA_DEVICE_MASTER detailed groups,
// not legacy benchmark summary strings.
// V25 — normalize internal Fotona lineup rendering to the same semantic depth
// and visual vocabulary across every device.
function v25TitleCaseLabel(value){
  const keepUpper = new Set(['ENT','PBM','LAUP','PFB','SWEEPS®','QSP®','VSP','ASP','USP','SSP','MSP','SP','LP','VLP']);
  return String(value||'').trim().split(/\s+/).map(word=>{
    if(keepUpper.has(word)) return word;
    if(word.includes('/')){
      return word.split('/').map(part=>{
        if(keepUpper.has(part)) return part;
        return part ? part.charAt(0).toUpperCase()+part.slice(1).toLowerCase() : part;
      }).join('/');
    }
    return word ? word.charAt(0).toUpperCase()+word.slice(1).toLowerCase() : word;
  }).join(' ');
}

function v25FlattenGroups(groups){
  if(!Array.isArray(groups)) return '';
  const seen=new Set();
  const items=[];
  groups.forEach(g=>{
    (g&&Array.isArray(g.items)?g.items:[]).forEach(item=>{
      const clean=String(item||'').trim();
      const key=clean.toLowerCase();
      if(clean && !seen.has(key)){
        seen.add(key);
        items.push(clean);
      }
    });
  });
  return items.join('; ');
}

function v25NormalizeClinicalVersatility(raw){
  const map = {
    'conservative/restorative':'Conservative / Restorative',
    'conservative':'Conservative',
    'restorative':'Restorative',
    'periodontal':'Periodontal',
    'endodontic':'Endodontic',
    'implantology':'Implantology',
    'prosthodontic':'Prosthodontic',
    'surgical':'Surgical',
    'hard-tissue surgery':'Hard-Tissue Surgery',
    'soft-tissue surgery':'Soft-Tissue Surgery',
    'therapeutic':'Therapeutic',
    'dental':'Dental',
    'aesthetic/dermatologic':'Aesthetic / Dermatologic',
    'ent':'ENT',
    'podiatric':'Podiatric',
    'pediatric':'Pediatric',
    'oral pathology':'Oral Pathology',
    'resurfacing':'Resurfacing',
    'skin rejuvenation':'Skin Rejuvenation',
    'wrinkles':'Wrinkles',
    'acne':'Acne',
    'hair removal':'Hair Removal',
    'hair reduction':'Hair Reduction',
    'vascular':'Vascular',
    'pigmented lesions':'Pigmented Lesions',
    'pfb':'PFB',
    'laup':'LAUP',
    'benign lesions':'Benign Lesions',
    'bracket/veneer debonding':'Bracket / Veneer Debonding',
    'hemostasis':'Hemostasis'
  };
  const vals=String(raw||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
  const seen=new Set();
  return vals.map(v=>{
    const key=v.toLowerCase();
    const normalized=map[key] || v25TitleCaseLabel(v);
    const nk=normalized.toLowerCase();
    if(seen.has(nk)) return null;
    seen.add(nk);
    return normalized;
  }).filter(Boolean).join('; ');
}

// Make ® smaller everywhere after render
function shrinkRegistered() {
  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(node => {
    if(node.nodeValue && node.nodeValue.includes('®')) {
      const span = document.createElement('span');
      span.innerHTML = node.nodeValue.replace(/®/g, '<span style="font-size:60%;vertical-align:super;line-height:0;">®</span>');
      node.parentNode.replaceChild(span, node);
    }
  });
}

 if(!canAdvance) return;
 state.step++;

}
function goBack() {
 if(state.step<=1){ state.step=0; render(); return; }
 state.step--;

 render();

<script>
(function () {
  function isResultsStep() {
    const text = document.body ? (document.body.innerText || '') : '';
    return document.body.classList.contains('results-page') ||
      /STEP\s*5\s*OF\s*5/i.test(text) ||
      /Your benchmark is ready/i.test(text) ||
      /vs\. Competition/i.test(text);
  }

  function normalizeName(text) {
    return (text || '')
      .toLowerCase()
      .replace(/®|™|\+/g, '')
      .replace(/advantage|edge|tie|fotona/g, '')
      .replace(/waterlase/ig, 'biolase waterlase')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function applyCleanAdvantageLogic() {
    const __viewText = document.body ? (document.body.innerText || '') : '';
    if (/Compare Within Fotona/i.test(__viewText) || /within the Fotona/i.test(__viewText) || /Fotona lineup/i.test(__viewText)) return;
    if (!isResultsStep()) return;

    document.querySelectorAll('.table-wrap table:not(.market-benchmark-table)').forEach(function(table) {
      const headerRow = table.querySelector('tr');
      if (!headerRow) return;

      const headers = Array.from(headerRow.querySelectorAll('th'));
      if (!headers.length) return;

      const finalHeader = headers[headers.length - 1];
      if (finalHeader) finalHeader.textContent = 'DEVICE ADVANTAGE';

      const headerNames = headers.map(function(th) {
        return normalizeName(th.textContent);
      });

      Array.from(table.querySelectorAll('tr')).forEach(function(row, rowIndex) {
        if (rowIndex === 0) return;

        row.classList.remove('fotona-win-row', 'tie-row');

        const cells = Array.from(row.querySelectorAll('td'));
        if (!cells.length) return;

        cells.forEach(function(cell) {
          cell.classList.remove('competitor-advantage-cell');
        });

        const last = cells[cells.length - 1];
        if (!last) return;

        const rawBadge = (last.textContent || '').trim();
        const normBadge = normalizeName(rawBadge);

        if (/tie/i.test(rawBadge)) {
          row.classList.add('tie-row');
          return;
        }

        if (/fotona/i.test(rawBadge)) {
          row.classList.add('fotona-win-row');
          return;
        }

        if (!normBadge) return;

        let matchedHeaderIndex = -1;
        let bestScore = 0;
        const badgeWords = normBadge.split(' ').filter(function(w) { return w.length >= 3; });

        headerNames.forEach(function(headerName, idx) {
          if (idx === 0 || idx === headers.length - 1) return;
          if (!headerName) return;

          const headerWords = headerName.split(' ').filter(Boolean);
          let score = 0;

          badgeWords.forEach(function(word) {
            if (headerWords.includes(word)) score += 3;
            else if (headerName.includes(word)) score += 2;
            else if (word.includes(headerName) || headerName.includes(word)) score += 1;
          });

          if (score > bestScore) {
            bestScore = score;
            matchedHeaderIndex = idx;
          }
        });

        if (matchedHeaderIndex > 0 && matchedHeaderIndex < cells.length - 1) {
          cells[matchedHeaderIndex].classList.add('competitor-advantage-cell');
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(applyCleanAdvantageLogic, 200);
  });

  document.addEventListener('click', function () {
    setTimeout(applyCleanAdvantageLogic, 250);
  });
})();
</script>


<script>
(function () {
  function isResultsStep() {
    const text = document.body ? (document.body.innerText || '') : '';
    return document.body.classList.contains('results-page') ||
      /STEP\s*5\s*OF\s*5/i.test(text) ||
      /Your benchmark is ready/i.test(text) ||
      /vs\. Competition/i.test(text);
  }

  function clean(text) {
    return (text || '')
      .toLowerCase()
      .replace(/®|™|\+/g, '')
      .replace(/fotona|advantage|edge|tie/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function headerMatchesBadge(header, badge) {
    const h = clean(header);
    const b = clean(badge);
    if (!h || !b) return false;

    const aliases = {
      'amd picasso': ['amd picasso', 'picasso'],
      'biolase waterlase': ['biolase waterlase', 'waterlase', 'biolase'],
      'periolase mvp 7': ['periolase mvp 7', 'periolase'],
      'convergent dental solea': ['convergent dental solea', 'convergent', 'solea'],
      'deka smartperio nd yag': ['deka smartperio', 'smartperio', 'deka'],
      'ultradent gemini': ['ultradent gemini', 'gemini'],
      'denmat sol desktop': ['denmat sol', 'sol desktop', 'denmat'],
      'biolase epic x': ['biolase epic x', 'epic x'],
      'dentsply sirolaser': ['dentsply sirolaser', 'sirolaser', 'dentsply'],
      'lightscalpel': ['lightscalpel'],
      'bien air ichiropro': ['bien air', 'ichiropro']
    };

    for (const key in aliases) {
      if (h.includes(key) || aliases[key].some(a => h.includes(a))) {
        if (aliases[key].some(a => b.includes(a))) return true;
      }
    }

    const hWords = h.split(' ').filter(w => w.length >= 3);
    const bWords = b.split(' ').filter(w => w.length >= 3);
    return hWords.some(w => bWords.includes(w) || b.includes(w));
  }

  function applyFinalAdvantageInlineStyles() {
    const __viewText = document.body ? (document.body.innerText || '') : '';
    if (/Compare Within Fotona/i.test(__viewText) || /within the Fotona/i.test(__viewText) || /Fotona lineup/i.test(__viewText)) return;
    if (!isResultsStep()) return;

    document.querySelectorAll('.table-wrap table:not(.market-benchmark-table)').forEach(table => {
      const headerRow = table.querySelector('tr');
      if (!headerRow) return;

      const headers = Array.from(headerRow.querySelectorAll('th'));
      if (!headers.length) return;

      headers[headers.length - 1].textContent = 'DEVICE ADVANTAGE';

      const headerTexts = headers.map(h => h.textContent || '');

      Array.from(table.querySelectorAll('tr')).forEach((row, rowIndex) => {
        if (rowIndex === 0) return;

        const cells = Array.from(row.querySelectorAll('td'));
        if (!cells.length) return;

        cells.forEach(cell => {
          cell.removeAttribute('data-advantage-owner');
          cell.querySelectorAll('li, span, div').forEach(el => {
            if (el.dataset.advantageInline === 'true') {
              el.style.color = '';
              el.style.fontWeight = '';
              delete el.dataset.advantageInline;
            }
          });
        });

        const last = cells[cells.length - 1];
        const badgeText = (last.textContent || '').trim();

        if (!badgeText || /tie/i.test(badgeText) || /fotona/i.test(badgeText)) return;

        let targetIndex = -1;
        for (let i = 1; i < headers.length - 1; i++) {
          if (headerMatchesBadge(headerTexts[i], badgeText)) {
            targetIndex = i;
            break;
          }
        }

        if (targetIndex > 0 && targetIndex < cells.length - 1) {
          const target = cells[targetIndex];
          target.setAttribute('data-advantage-owner', 'true');
          target.querySelectorAll('li, span, div').forEach(el => {
            el.style.color = '#d19600';
            el.style.fontWeight = '700';
            el.dataset.advantageInline = 'true';
          });
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(applyFinalAdvantageInlineStyles, 300);
  });

  document.addEventListener('click', function () {
    setTimeout(applyFinalAdvantageInlineStyles, 300);
  });
})();
</script>
